name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Resolve site URL and base path
        id: pages
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -s public/CNAME ]; then
            # Custom domain: served from the root.
            site="https://$(tr -d '[:space:]' < public/CNAME)"; base="/"
          elif [[ "$repo" == *.github.io ]]; then
            # User/organisation site: served from the root.
            site="https://${owner}.github.io"; base="/"
          else
            # Project site: served under /<repo>/.
            site="https://${owner}.github.io"; base="/${repo}/"
          fi
          echo "site=${site}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "Building for ${site}${base}"

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.site }}
          BASE_PATH: ${{ steps.pages.outputs.base }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
